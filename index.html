<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Judicial Ecosystem - Justice at Fingertips</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      
      :root {
        --background: #f8fafc;
        --foreground: #0f172a;
        --card: #ffffff;
        --card-foreground: #0f172a;
        --primary: #2563eb;
        --primary-foreground: #ffffff;
        --secondary: #f1f5f9;
        --secondary-foreground: #475569;
        --muted: #f8fafc;
        --muted-foreground: #64748b;
        --accent: #4f46e5;
        --accent-foreground: #ffffff;
        --border: #e2e8f0;
        --ring: #2563eb;
        --shadow: rgba(15, 23, 42, 0.08);
      }
      [data-theme="dark"] {
        --background: #020617;
        --foreground: #f1f5f9;
        --card: #0f172a;
        --card-foreground: #f8fafc;
        --primary: #60a5fa;
        --primary-foreground: #020617;
        --secondary: #1e293b;
        --secondary-foreground: #cbd5e1;
        --muted: #0f172a;
        --muted-foreground: #94a3b8;
        --accent: #818cf8;
        --accent-foreground: #020617;
        --border: #334155;
        --ring: #60a5fa;
        --shadow: rgba(0, 0, 0, 0.3);
      }
      body {
        background-color: var(--background);
        color: var(--foreground);
        transition: background-color 0.3s ease, color 0.3s ease;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      .glass {
        background: var(--card);
        opacity: 0.98;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .shadow-premium {
        box-shadow: 0 4px 6px -1px var(--shadow), 0 2px 4px -2px var(--shadow);
      }
      .shadow-premium-lg {
        box-shadow: 0 10px 15px -3px var(--shadow), 0 4px 6px -4px var(--shadow);
      }
      
      * {
        transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }
      
      /* Reset for text visibility in specific themes */
      .text-theme-foreground { color: var(--foreground); }
      .text-theme-muted { color: var(--muted-foreground); }
      .bg-theme-card { background-color: var(--card); }
      .bg-theme-background { background-color: var(--background); }
      .border-theme-border { border-color: var(--border); }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "chart.js": "https://aistudiocdn.com/chart.js@^4.5.1"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
